name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/qobilidop/bpf-tv-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BUILD_ROOT: ${{ github.workspace }}/build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Initialize pinned submodules (shallow)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            third_party/llvm-project third_party/alive2

      - name: Restore dependency build tree
        uses: actions/cache@v4
        with:
          path: |
            build-linux/llvm
            build-linux/alive2
          key: deps-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build dependencies and bpf-tv
        run: bash scripts/build-deps.sh

      - name: Conformance suite
        run: |
          if ! dpkg -s libboost-program-options-dev >/dev/null 2>&1; then
            echo "boost not in image yet (pre-refresh); skipping"
            exit 0
          fi
          git submodule update --init --depth 1 --recursive third_party/bpf_conformance
          cmake -S third_party/bpf_conformance -B "$BUILD_ROOT/bpf_conformance" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C "$BUILD_ROOT/bpf_conformance"
          "$BUILD_ROOT/bpf_conformance/bin/bpf_conformance_runner" \
            --test_file_directory third_party/bpf_conformance/tests \
            --plugin_path "$BUILD_ROOT/alive2/bpf-tv/bpf-tv-conformance-plugin" \
            --cpu_version v4 | tee conf.txt
          grep -qE "Passed 3(09|1[0-2]) out of" conf.txt

      - name: End-to-end suite
        run: bash tests/e2e/run.sh

      - name: Corpus sweep
        run: |
          python3 scripts/corpus_run.py \
            --bpf-tv "$BUILD_ROOT/alive2/bpf-tv/bpf-tv" \
            --out "$BUILD_ROOT/eval"
          # the sweep must be alarm-free modulo the one documented
          # residual (simplifycfg.ll; see DECISIONS.md)
          incorrect=$(grep -c '"INCORRECT"' "$BUILD_ROOT/eval/corpus-results.jsonl" || true)
          echo "INCORRECT count: $incorrect"
          test "$incorrect" -le 1

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            build-linux/eval/corpus-report.md
            build-linux/eval/corpus-results.jsonl
